name: Setup project
on: workflow_dispatch

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-extracting bundle
        run: |
          curl -L "https://d3p662obnq9uz2.cloudfront.net/file-interaction/669662c9-text_1789687492956.txt" -o setup.sh
          bash setup.sh
          rm setup.sh
      - name: Commit all files
        run: |
          git config user.name "XanderMortensen"
          git config user.email "XanderMortensen@users.noreply.github.com"
          git add .
          git commit -m "Add Baiboly app, converter, and CI"
          git push
